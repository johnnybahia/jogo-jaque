<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<meta name="theme-color" content="#0d2b3e" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="icon" href="./icons/icon-192.png" />
<link rel="apple-touch-icon" href="./icons/icon-192.png" />
<title>Beach Tênis</title>
</head>
<body>
<canvas id="c"></canvas>
<div id="camZone"></div>
<div id="hud"><div id="rally"><small>RALI</small><b>0</b></div><div id="info"></div><div id="staWrap" title="Fôlego"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg><div id="sta"></div></div></div>
<button id="gear" aria-label="Ajustes"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
<div id="camBtns"><button id="zoomIn" aria-label="Aproximar"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button><button id="zoomOut" aria-label="Afastar"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg></button><button id="camReset" aria-label="Voltar à posição da câmera escolhida"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v4M12 17.5v4M2.5 12h4M17.5 12h4"/></svg></button><button id="camCycle" aria-label="Trocar de câmera"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z" transform="translate(0.5 0) scale(.96)"/><circle cx="12" cy="13" r="3.6"/></svg></button></div>
<div id="leftBtns"><button id="menuBtn"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>Menu</button><button id="installChip" hidden></button><button id="viewBtn"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2.2"/><path d="M8 3v18M16 3v18M3 12h18M3 7.5h5M3 16.5h5M16 16.5h5M16 7.5h5"/></svg>Golpes</button></div>
<div id="score" hidden></div>
<div id="endCard" hidden></div>
<div id="toast"></div>
<div id="joyZone"><div id="joyBase"><div id="knob"></div></div></div>
<div id="cueName"></div>
<div id="calls"></div>
<div id="btns"><button id="serveBtn">SACAR</button><div id="swingWrap"><div id="timeRing"></div><button id="swingBtn">GOLPE</button></div></div>
<div id="viewBar" hidden>
  <select id="viewSel" aria-label="Golpe"></select>
  <input id="viewSeek" type="range" min="0" max="1000" value="0" aria-label="Momento do golpe">
  <div class="vrow"><button id="vPrev">◀ Ant.</button><button id="vPlay">Pausar</button><button id="vNext">Próx. ▶</button><button id="vSpeed" aria-label="Velocidade">1×</button><button id="vExit">✕ Sair</button></div>
</div>
<div id="camEdit" hidden>
  <button id="ceEye" aria-label="Ver a tela inteira">👁</button>
  <div id="ceTabs"></div>
  <div class="ce-sl">
    <label>Giro<input id="ceYaw" type="range" min="-180" max="180" step="1" aria-label="Giro"><b id="ceYawV"></b></label>
    <label>Altura<input id="cePitch" type="range" min="4" max="77" step="1" aria-label="Altura (inclinação)"><b id="cePitchV"></b></label>
    <label>Distância<input id="ceDist" type="range" min="18" max="140" step="1" aria-label="Distância"><b id="ceDistV"></b></label>
  </div>
  <div class="ce-btns"><button id="ceSave" class="main">💾 Salvar</button><button id="ceReset">↺ Padrão</button><button id="ceDone">✔ Pronto</button></div>
  <small>Arraste a tela para girar · pinça ou ＋ － para o zoom · ⟲ volta à salva</small>
</div>
<div id="panel" hidden></div>
<div id="upd" hidden><span>Nova versão disponível</span><button id="updBtn">Atualizar</button></div>
<div id="cover">
  <div class="cv-card">
    <div class="cv-head">
    <svg class="cv-logo" viewBox="0 0 120 120" aria-hidden="true">
      <defs><clipPath id="cvClip"><circle cx="60" cy="60" r="53"/></clipPath></defs>
      <circle cx="60" cy="60" r="57" fill="#0d2b3e" stroke="#ff6a00" stroke-width="4"/>
      <g clip-path="url(#cvClip)">
        <rect x="0" y="0" width="120" height="120" fill="#9fd3f2"/>
        <circle cx="46" cy="52" r="23" fill="#ffb347"/>
        <path d="M0 72 q10 -8 20 0 t20 0 t20 0 t20 0 t20 0 t20 0 V120 H0z" fill="#1b6fb4"/>
        <path d="M0 86 q10 -8 20 0 t20 0 t20 0 t20 0 t20 0 t20 0 V120 H0z" fill="#e7d3a0"/>
      </g>
      <g transform="rotate(32 70 62)">
        <ellipse cx="70" cy="46" rx="15" ry="20" fill="#1b1d22" stroke="#ff6a00" stroke-width="3.5"/>
        <g fill="#9fd3f2"><circle cx="64" cy="38" r="1.7"/><circle cx="70" cy="36" r="1.7"/><circle cx="76" cy="38" r="1.7"/><circle cx="64" cy="45" r="1.7"/><circle cx="70" cy="43" r="1.7"/><circle cx="76" cy="45" r="1.7"/><circle cx="67" cy="52" r="1.7"/><circle cx="73" cy="52" r="1.7"/></g>
        <rect x="67.5" y="65" width="5" height="26" rx="2.5" fill="#fff"/>
      </g>
      <circle cx="30" cy="84" r="7" fill="#d8f23a" stroke="#6a7a10" stroke-width="1.4"/>
    </svg>
    <h1>Jaque <span>Beach Tennis</span></h1>
    <p class="cv-sub">Play Match</p>
    </div>
    <div class="cv-body">
    <button id="cvMatch" class="cv-main"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12-7.5a1 1 0 0 0 0-1.72l-12-7.5A1 1 0 0 0 7 4.5z"/></svg>Partida</button>
    <div class="cv-row">
      <label>Modo<select id="cvMode"><option value="single">Single · 1 × 1</option><option value="duplas">Duplas · 2 × 2</option></select></label>
      <label>Nível<select id="cvLvl"><option value="facil">Fácil</option><option value="medio">Médio</option><option value="dificil">Difícil</option></select></label>
    </div>
    <div class="cv-row"><label>Formato<select id="cvFmt"><option value="rapida">Rápida · 4 games</option><option value="set">1 set · 6 games</option><option value="melhor3">Melhor de 3 sets</option></select></label></div>
    <p class="cv-hint" id="cvHint" hidden>Você e a Lari (IA no nível difícil) contra a Bia e a Duda (no nível escolhido).</p>
    <div class="cv-cam"><span class="cv-lab">Câmera</span><div class="cv-camrow"><div id="cvCams"></div><button id="cvCamEdit"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z" transform="translate(0.5 0) scale(.96)"/><circle cx="12" cy="13" r="3.6"/></svg>Ajustar</button></div></div>
    <div class="cv-row2"><button id="cvTrain"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="1.5"/><path d="M3 9.5h18M3 14.5h18M9 4v5.5M15 9.5v5M9 14.5V20"/></svg>Treino</button><button id="cvMoves"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2.2"/><path d="M8 3v18M16 3v18M3 12h18M3 7.5h5M3 16.5h5M16 16.5h5M16 7.5h5"/></svg>Golpes</button><button id="cvRank"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="6.5"/><path d="M8.6 13.4 7.5 22l4.5-2.7 4.5 2.7-1.1-8.6"/></svg>Ranking</button></div>
    <div id="cvRankBox" hidden></div>
    <p class="cv-foot">Para a Jaqueline, com carinho <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21.2C6 17 2.2 13.3 2.2 9.2 2.2 6.3 4.4 4.2 7 4.2c2 0 3.8 1.1 5 3 1.2-1.9 3-3 5-3 2.6 0 4.8 2.1 4.8 5 0 4.1-3.8 7.8-9.8 12z"/></svg></p>
    </div>
  </div>
</div>
<div id="loading"><div class="ld"><div class="ld-t">Jaque <span>Beach Tennis</span></div><div class="ld-bar"><i></i></div><small>Carregando a praia…</small></div></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
